<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #FAFAFA;
    font-family: "Inter", sans-serif;
    color: #1A1A1A;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { position: absolute; left: 96px; top: 168px; }
  .name {
    font-size: 108px; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; font-variation-settings: "opsz" 32;
  }
  .cn { font-size: 34px; color: #8A8A8A; margin-top: 2px; font-weight: 400; }
  .line {
    margin-top: 46px; font-size: 44px; font-weight: 500; letter-spacing: -0.015em; color: #1A1A1A;
  }
  .sub { margin-top: 12px; font-size: 30px; color: #8A8A8A; font-weight: 400; }
  .footer { position: absolute; left: 96px; bottom: 52px; }
  .rule { width: 84px; height: 3px; background: #003366; margin-bottom: 14px; }
  .url { font-family: "JetBrains Mono", monospace; font-size: 26px; color: #1B2A4A; font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">Yanjun Chen</div>
    <div class="cn">陈彦筠</div>
    <div class="line">Making the training environment as trainable as the model.</div>
    <div class="sub">PhD candidate, The Hong Kong Polytechnic University</div>
  </div>
  <div class="footer">
    <div class="rule"></div>
    <div class="url">battam1111.github.io</div>
  </div>
</body>
</html>
