{% raw %}<figure class="gf ef ef-f-long" id="ef-long-ja"><div class="ef-box"><p class="ef-h">タスクが長いほど、一つの点数が受け持つステップは増え、グループが全滅しやすくなる</p><div class="ef-ctl"><label for="ef-long-ja-r">一回の試行のステップ数</label><output for="ef-long-ja-r">40</output><input type="range" id="ef-long-ja-r" min="1" max="400" value="40"><div class="ef-presets"><button type="button" data-n="2">数学の問題、2 ステップ</button><button type="button" data-n="30">30 ステップ</button><button type="button" data-n="300">コーディングエージェント、300 ステップ</button></div></div><div class="ef-tracks"><div class="ef-track"><span class="ef-bar" style="width:9.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track"><span class="ef-bar" style="width:2.75%"></span><span class="ef-mark">✕</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><span class="ef-endline" style="left:10.00%"><span>終わり</span></span></div><div class="ef-axis"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span></div><div class="ef-tiles"><div class="ef-tile"><span class="k">このグループで成功した数</span><span class="v">3 / 8</span></div><div class="ef-tile"><span class="k">一つの点数が受け持つ</span><span class="v">40 ステップ</span></div><div class="ef-tile"><span class="k">グループ内の比較</span><span class="v">成功と失敗が混じる、信号あり</span><span class="s">この仮定では、8 回すべてが失敗する確率は約 2%</span></div></div></div><script>(function(){var f=document.getElementById("ef-long-ja"),F=[36, 0, 120, 11, 0, 230, 69, 0],T={"steps": "{} ステップ", "mixed": "成功と失敗が混じる、信号あり", "dead": "全部失敗、信号なし", "prob": "この仮定では、8 回すべてが失敗する確率は約 {}%"},r=f.querySelector("input"),o=f.querySelector("output"),tr=f.querySelectorAll(".ef-track"),el=f.querySelector(".ef-endline"),ti=f.querySelectorAll(".ef-tile"),v=f.querySelectorAll(".ef-tile .v"),s=f.querySelector(".ef-tile .s");function up(){var n=+r.value,a=0;o.textContent=n;tr.forEach(function(t,i){var fi=F[i],ok=fi>n,len=fi===0?n:Math.min(fi,n);if(ok)a++;t.classList.toggle("ok",ok);t.querySelector(".ef-bar").style.width=Math.max(len/400*100,.8)+"%";t.querySelector(".ef-mark").textContent=ok?"\u2713":"\u2715"});el.style.left=n/400*100+"%";el.classList.toggle("far",n>340);el.classList.toggle("near",n<40);v[0].textContent=a+" / 8";v[1].textContent=T.steps.replace("{}",n);v[2].textContent=a?T.mixed:T.dead;ti[2].classList.toggle("dead",!a);var p=Math.pow(1-.6*Math.pow(.99,n),8)*100;s.textContent=T.prob.replace("{}",p<1?"<1":Math.round(p))}r.oninput=up;f.querySelectorAll("button").forEach(function(b){b.onclick=function(){r.value=b.dataset.n;up()}});up()})();</script><figcaption class="ef-cap">説明のための計算で、実測ではありません。各試行は 6 割の確率で正しい方向に進み、そのあとは各ステップが 1% の確率で誤り、一つ誤ると課題全体が失敗すると仮定しています。図はこの仮定のもとで選んだ 8 回の試行です。青は成功、灰色は失敗で、灰色の棒が止まっているところが誤ったステップです。</figcaption></figure>{% endraw %}
