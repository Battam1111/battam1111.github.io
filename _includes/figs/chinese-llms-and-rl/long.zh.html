{% raw %}<figure class="gf ef ef-f-long" id="ef-long-zh"><div class="ef-box"><p class="ef-h">任务越长，一个分数要管的步数越多，一组尝试也越容易全部失败</p><div class="ef-ctl"><label for="ef-long-zh-r">一次尝试有多少步</label><output for="ef-long-zh-r">40</output><input type="range" id="ef-long-zh-r" min="1" max="400" value="40"><div class="ef-presets"><button type="button" data-n="2">数学题，2 步</button><button type="button" data-n="30">30 步</button><button type="button" data-n="300">coding agent，300 步</button></div></div><div class="ef-tracks"><div class="ef-track"><span class="ef-bar" style="width:9.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track"><span class="ef-bar" style="width:2.75%"></span><span class="ef-mark">✕</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track ok"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✓</span></div><div class="ef-track"><span class="ef-bar" style="width:10.00%"></span><span class="ef-mark">✕</span></div><span class="ef-endline" style="left:10.00%"><span>终点</span></span></div><div class="ef-axis"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span></div><div class="ef-tiles"><div class="ef-tile"><span class="k">这一组里做成的</span><span class="v">3 / 8</span></div><div class="ef-tile"><span class="k">一个分数要管</span><span class="v">40 步</span></div><div class="ef-tile"><span class="k">组内比较</span><span class="v">有成有败，有信号</span><span class="s">照这个假设，8 次全部失败的概率约 2%</span></div></div></div><script>(function(){var f=document.getElementById("ef-long-zh"),F=[36, 0, 120, 11, 0, 230, 69, 0],T={"steps": "{} 步", "mixed": "有成有败，有信号", "dead": "全部失败，没有信号", "prob": "照这个假设，8 次全部失败的概率约 {}%"},r=f.querySelector("input"),o=f.querySelector("output"),tr=f.querySelectorAll(".ef-track"),el=f.querySelector(".ef-endline"),ti=f.querySelectorAll(".ef-tile"),v=f.querySelectorAll(".ef-tile .v"),s=f.querySelector(".ef-tile .s");function up(){var n=+r.value,a=0;o.textContent=n;tr.forEach(function(t,i){var fi=F[i],ok=fi>n,len=fi===0?n:Math.min(fi,n);if(ok)a++;t.classList.toggle("ok",ok);t.querySelector(".ef-bar").style.width=Math.max(len/400*100,.8)+"%";t.querySelector(".ef-mark").textContent=ok?"\u2713":"\u2715"});el.style.left=n/400*100+"%";el.classList.toggle("far",n>340);el.classList.toggle("near",n<40);v[0].textContent=a+" / 8";v[1].textContent=T.steps.replace("{}",n);v[2].textContent=a?T.mixed:T.dead;ti[2].classList.toggle("dead",!a);var p=Math.pow(1-.6*Math.pow(.99,n),8)*100;s.textContent=T.prob.replace("{}",p<1?"<1":Math.round(p))}r.oninput=up;f.querySelectorAll("button").forEach(function(b){b.onclick=function(){r.value=b.dataset.n;up()}});up()})();</script><figcaption class="ef-cap">示意计算，不是实测。假设每次尝试有六成机会方向对；方向对了以后，每一步还有 1% 的可能出错，错一步整题就失败。图里是照这个假设取的一组 8 次尝试，蓝色是做成的，灰色是失败的，灰条停在哪里，就是在哪一步出的错。</figcaption></figure>{% endraw %}
