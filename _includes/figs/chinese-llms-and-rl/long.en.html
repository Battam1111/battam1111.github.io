gnal</span><span class="s">Under these assumptions, all 8 fail about 2% of the time</span></div></div></div><script>(function(){var f=document.getElementById("ef-long-en"),F=[36, 0, 120, 11, 0, 230, 69, 0],T={"steps": "{} steps", "mixed": "some succeed, some fail: there is a signal", "dead": "all fail: no signal", "prob": "Under these assumptions, all 8 fail about {}% of the time"},r=f.querySelector("input"),o=f.querySelector("output"),tr=f.querySelectorAll(".ef-track"),el=f.querySelector(".ef-endline"),ti=f.querySelectorAll(".ef-tile"),v=f.querySelectorAll(".ef-tile .v"),s=f.querySelector(".ef-tile .s");function up(){var n=+r.value,a=0;o.textContent=n;tr.forEach(function(t,i){var fi=F[i],ok=fi>n,len=fi===0?n:Math.min(fi,n);if(ok)a++;t.classList.toggle("ok",ok);t.querySelector(".ef-bar").style.width=Math.max(len/400*100,.8)+"%";t.querySelector(".ef-mark").textContent=ok?"\u2713":"\u2715"});el.style.left=n/400*100+"%";el.classList.toggle("far",n>340);el.classList.toggle("near",n<40);v[0].textContent=a+" / 8";v[1].textContent=T.steps.replace("{}",n);v[2].textContent=a?T.mixed:T.dead;ti[2].classList.toggle("dead",!a);var p=Math.pow(1-.6*Math.pow(.99,n),8)*100;s.textContent=T.prob.replace("{}",p<1?"<1":Math.round(p))}r.oninput=up;f.querySelectorAll("button").forEach(function(b){b.onclick=function(){r.value=b.dataset.n;up()}});up()})();</script><figcaption class="ef-cap">A worked example, not a measurement. Assume each attempt has a 60% chance of starting in the right direction, and after that each step has a 1% chance of going wrong, with one wrong step failing the task. The figure shows one group of 8 attempts drawn under these assumptions. Blue attempts succeed, grey ones fail, and a grey bar stops at the step where it went wrong.</figcaption></figure>{% endraw %}
