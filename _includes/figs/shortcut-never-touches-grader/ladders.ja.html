<figure class="gf"><div class="gf-ladders"><div class="gf-col"><h4>TermGrade、既製のモデル六つ</h4><div class="gf-step " style="margin-left:0px"><span class="gf-n">34,524</span><span class="gf-t">回、課題文に採点用のパスなし</span></div><div class="gf-step " style="margin-left:22px"><span class="gf-n">295</span><span class="gf-t">回、コマンドに採点用のパス<small>0.85%、最も高いモデルで 7.87%</small></span></div><div class="gf-step gf-hi" style="margin-left:44px"><span class="gf-n">3</span><span class="gf-t">回、実際に書き込み<small>すべてディスクが満杯のバッチ</small></span></div></div><div class="gf-col"><h4>Tmax、500 ステップの RL 訓練</h4><div class="gf-step " style="margin-left:0px"><span class="gf-n">128,000</span><span class="gf-t">回</span></div><div class="gf-step " style="margin-left:22px"><span class="gf-n">26</span><span class="gf-t">回、コマンドにテストファイル</span></div><div class="gf-step gf-empty" style="margin-left:44px"><span class="gf-n">0</span><span class="gf-t">回、中身を入手<small>提出前はファイルが存在しない</small></span></div></div></div><figcaption class="gf-cap">二つの公開記録で、採点に触れたのはどれだけか。どちらもテストは採点時か提出時に初めてコンテナに入るので、これはその設定のもとでの結果です。パスのスキャンでは、テストに合わせて出力を決め打ちするやり方は見つけられません。</figcaption></figure>
