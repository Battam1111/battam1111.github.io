{% raw %}<figure class="gf ef ef-f-chain" id="ef-chain-ja"><div class="ef-box"><p class="ef-h">訓練は一本の鎖。どの輪が切れても、鎖全体が引きずり倒される</p><div class="ef-hang"><svg viewBox="0 0 300 394" role="img" aria-label="訓練は一本の鎖。どの輪が切れても、鎖全体が引きずり倒される"><path class="hook" d="M20 4 H100 M60 4 V20"/><g class="lk0"><ellipse cx="60" cy="52" rx="21" ry="34" pathLength="100"/><text x="100" y="58">データ</text><g class="rest"><g class="lk1"><ellipse cx="60" cy="114" rx="21" ry="34" pathLength="100"/><text x="100" y="114">アルゴリズム<tspan x="100" dy="19" class="sub">credit assignment を含む</tspan></text><g class="rest"><g class="lk2"><ellipse cx="60" cy="176" rx="21" ry="34" pathLength="100"/><text x="100" y="182">インフラ</text><g class="rest"><g class="lk3"><ellipse cx="60" cy="238" rx="21" ry="34" pathLength="100"/><text x="100" y="244">環境</text><g class="rest"><g class="w"><line x1="60" y1="272" x2="60" y2="296"/><rect x="8" y="296" width="190" height="46" rx="8"/><text x="103" y="325" text-anchor="middle">訓練されたモデル</text></g></g></g></g></g></g></g></g></g></svg></div><p class="msg">どの輪もそろっていて、訓練できる</p><p class="ef-note">下のボタンを押して、どれか一つの輪を切ってみてください</p><div class="ef-presets"><button type="button" class="lk">データ</button><button type="button" class="lk">アルゴリズム</button><button type="button" class="lk">インフラ</button><button type="button" class="lk">環境</button><button type="button" class="rs">元に戻す</button></div></div><script>(function(){var f=document.getElementById("ef-chain-ja"),T={"ok": "どの輪もそろっていて、訓練できる", "bad": "「{}」が壊れ、鎖全体が倒れた"},N=["データ", "アルゴリズム", "インフラ", "環境"],b=f.querySelectorAll(".lk"),s=f.querySelector("svg"),m=f.querySelector(".msg"),r=f.querySelector(".rs");function set(k){for(var i=0;i<4;i++){var g=s.querySelector(".lk"+i);g.classList.toggle("broken",i===k);g.querySelector(".rest").classList.toggle("fall",i===k)}b.forEach(function(x,i){x.classList.toggle("on",i===k)});m.textContent=k<0?T.ok:T.bad.replace("{}",N[k])}b.forEach(function(x,i){x.onclick=function(){set(i)}});r.onclick=function(){set(-1)}})();</script><figcaption class="ef-cap">説明のための図です。一つの輪だけを認めるのは、鎖は一つの輪さえ丈夫なら足りると考えるようなものです。</figcaption></figure>{% endraw %}
