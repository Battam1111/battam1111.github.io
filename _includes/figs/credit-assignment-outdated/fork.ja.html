{% raw %}<figure class="gf ef ef-f-fork" id="ef-fork-ja"><div class="ef-box"><p class="ef-h">推論の中で、本当に迷っていて方向を決めるトークンはごく一部</p><div class="ef-presets"><button type="button" class="on">すべてのトークン</button><button type="button">分岐トークンだけ</button></div><div class="ef-fork"><span class="tk"><s><i style="height:14%"></i></s><b>二つの</b></span><span class="tk"><s><i style="height:16%"></i></s><b>数を</b></span><span class="tk"><s><i style="height:17%"></i></s><b>x,</b></span><span class="tk"><s><i style="height:19%"></i></s><b>y</b></span><span class="tk"><s><i style="height:16%"></i></s><b>と</b></span><span class="tk hi"><s><i style="height:98%"></i></s><b>おく</b></span><span class="tk"><s><i style="height:4%"></i></s><b>。</b></span><span class="tk"><s><i style="height:11%"></i></s><b>題意</b></span><span class="tk hi"><s><i style="height:98%"></i></s><b>より</b></span><span class="tk"><s><i style="height:14%"></i></s><b>x+y=10</b></span><span class="tk"><s><i style="height:18%"></i></s><b>,</b></span><span class="tk"><s><i style="height:6%"></i></s><b>xy=21</b></span><span class="tk"><s><i style="height:12%"></i></s><b>。</b></span><span class="tk hi"><s><i style="height:79%"></i></s><b>よって</b></span><span class="tk"><s><i style="height:13%"></i></s><b>x,</b></span><span class="tk"><s><i style="height:13%"></i></s><b>y</b></span><span class="tk"><s><i style="height:4%"></i></s><b>は</b></span><span class="tk"><s><i style="height:7%"></i></s><b>t²−10t+21=0</b></span><span class="tk"><s><i style="height:8%"></i></s><b>の</b></span><span class="tk"><s><i style="height:19%"></i></s><b>二つの</b></span><span class="tk"><s><i style="height:16%"></i></s><b>解</b></span><span class="tk"><s><i style="height:7%"></i></s><b>。</b></span><span class="tk hi"><s><i style="height:94%"></i></s><b>待って</b></span><span class="tk"><s><i style="height:6%"></i></s><b>、</b></span><span class="tk hi"><s><i style="height:89%"></i></s><b>まず</b></span><span class="tk"><s><i style="height:6%"></i></s><b>判別式</b></span><span class="tk"><s><i style="height:4%"></i></s><b>を</b></span><span class="tk"><s><i style="height:18%"></i></s><b>確かめる</b></span><span class="tk"><s><i style="height:7%"></i></s><b>。</b></span><span class="tk"><s><i style="height:7%"></i></s><b>100−84=16</b></span><span class="tk"><s><i style="height:20%"></i></s><b>>0</b></span><span class="tk hi"><s><i style="height:96%"></i></s><b>なので</b></span><span class="tk"><s><i style="height:9%"></i></s><b>実数解</b></span><span class="tk"><s><i style="height:19%"></i></s><b>が</b></span><span class="tk"><s><i style="height:13%"></i></s><b>ある</b></span><span class="tk"><s><i style="height:15%"></i></s><b>。</b></span><span class="tk hi"><s><i style="height:78%"></i></s><b>したがって</b></span><span class="tk"><s><i style="height:19%"></i></s><b>t=3</b></span><span class="tk"><s><i style="height:15%"></i></s><b>または</b></span><span class="tk"><s><i style="height:19%"></i></s><b>t=7</b></span><span class="tk"><s><i style="height:18%"></i></s><b>。</b></span></div><p class="ef-legend"><span><i class="ef-sw bar"></i>棒が高いほど、モデルはその位置で迷っている（エントロピーが高い）</span></p></div><script>(function(){var f=document.getElementById("ef-fork-ja"),k=f.querySelector(".ef-fork"),b=f.querySelectorAll(".ef-presets button");b.forEach(function(x,i){x.onclick=function(){k.classList.toggle("only",i===1);b.forEach(function(y,j){y.classList.toggle("on",j===i)})}})})();</script><figcaption class="ef-cap">説明のための図で、棒の高さは実測ではありません。論文の集計では、エントロピーの高いトークンの多くは wait、however、thus、suppose のように、話の転換や前進、仮定の導入を表す語でした。エントロピーの低いトークンの多くは、単語の後半や数式、コードの断片です。この高エントロピーの 2 割だけを更新するのが、その論文のやり方です。</figcaption></figure>{% endraw %}
