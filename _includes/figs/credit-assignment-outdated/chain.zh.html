{% raw %}<figure class="gf ef ef-f-chain" id="ef-chain-zh"><div class="ef-box"><p class="ef-h">训练是一条链，哪一环掉链子，整条链都会被拖垮</p><div class="ef-hang"><svg viewBox="0 0 300 394" role="img" aria-label="训练是一条链，哪一环掉链子，整条链都会被拖垮"><path class="hook" d="M20 4 H100 M60 4 V20"/><g class="lk0"><ellipse cx="60" cy="52" rx="21" ry="34" pathLength="100"/><text x="100" y="58">data</text><g class="rest"><g class="lk1"><ellipse cx="60" cy="114" rx="21" ry="34" pathLength="100"/><text x="100" y="114">算法<tspan x="100" dy="19" class="sub">包括 credit assignment</tspan></text><g class="rest"><g class="lk2"><ellipse cx="60" cy="176" rx="21" ry="34" pathLength="100"/><text x="100" y="182">infra</text><g class="rest"><g class="lk3"><ellipse cx="60" cy="238" rx="21" ry="34" pathLength="100"/><text x="100" y="244">环境</text><g class="rest"><g class="w"><line x1="60" y1="272" x2="60" y2="296"/><rect x="8" y="296" width="190" height="46" rx="8"/><text x="103" y="325" text-anchor="middle">训出来的模型</text></g></g></g></g></g></g></g></g></g></svg></div><p class="msg">每一环都在，能训出来</p><p class="ef-note">点下面的按钮，让其中一环断开</p><div class="ef-presets"><button type="button" class="lk">data</button><button type="button" class="lk">算法</button><button type="button" class="lk">infra</button><button type="button" class="lk">环境</button><button type="button" class="rs">复原</button></div></div><script>(function(){var f=document.getElementById("ef-chain-zh"),T={"ok": "每一环都在，能训出来", "bad": "「{}」出了问题，整条链被拖垮"},N=["data", "算法", "infra", "环境"],b=f.querySelectorAll(".lk"),s=f.querySelector("svg"),m=f.querySelector(".msg"),r=f.querySelector(".rs");function set(k){for(var i=0;i<4;i++){var g=s.querySelector(".lk"+i);g.classList.toggle("broken",i===k);g.querySelector(".rest").classList.toggle("fall",i===k)}b.forEach(function(x,i){x.classList.toggle("on",i===k)});m.textContent=k<0?T.ok:T.bad.replace("{}",N[k])}b.forEach(function(x,i){x.onclick=function(){set(i)}});r.onclick=function(){set(-1)}})();</script><figcaption class="ef-cap">示意。只认其中一环
