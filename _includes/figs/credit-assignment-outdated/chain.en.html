{% raw %}<figure class="gf ef ef-f-chain" id="ef-chain-en"><div class="ef-box"><p class="ef-h">Training is a chain; if any link breaks, the whole chain goes down</p><div class="ef-hang"><svg viewBox="0 0 300 394" role="img" aria-label="Training is a chain; if any link breaks, the whole chain goes down"><path class="hook" d="M20 4 H100 M60 4 V20"/><g class="lk0"><ellipse cx="60" cy="52" rx="21" ry="34" pathLength="100"/><text x="100" y="58">data</text><g class="rest"><g class="lk1"><ellipse cx="60" cy="114" rx="21" ry="34" pathLength="100"/><text x="100" y="114">algorithms<tspan x="100" dy="19" class="sub">credit assignment included</tspan></text><g class="rest"><g class="lk2"><ellipse cx="60" cy="176" rx="21" ry="34" pathLength="100"/><text x="100" y="182">infrastructure</text><g class="rest"><g class="lk3"><ellipse cx="60" cy="238" rx="21" ry="34" pathLength="100"/><text x="100" y="244">environments</text><g class="rest"><g class="w"><line x1="60" y1="272" x2="60" y2="296"/><rect x="8" y="296" width="190" height="46" rx="8"/><text x="103" y="325" text-anchor="middle">the trained model</text></g></g></g></g></g></g></g></g></g></svg></div><p class="msg">Every link holds, so the model trains</p><p class="ef-note">Press a button below to break one link</p><div class="ef-presets"><button type="button" class="lk">data</button><button type="button" class="lk">algorithms</button><button type="button" class="lk">infrastructure</button><button type="button" class="lk">environments</button><button type="button" class="rs">Restore</button></div></div><script>(function(){var f=document.getElementById("ef-chain-en"),T={"ok": "Every link holds, so the model trains", "bad": "“{}” broke, and the whole chain went down"},N=["data", "algorithms", "infrastructure", "environments"],b=f.querySelectorAll(".lk"),s=f.querySelector("svg"),m=f.querySelector(".msg"),r=f.querySelector(".rs");function set(k){for(var i=0;i<4;i++){var g=s.querySelector(".lk"+i);g.classList.toggle("broken",i===k);g.querySelector(".rest").classList.toggle("fall",i===k)}b.forEach(function(x,i){x.classList.toggle("on",i===k)});m.textContent=k<0?T.ok:T.bad.replace("{}",N[k])}b.forEach(function(x,i){x.onclick=function(){set(i)}});r.onclick=function(){set(-1)}})();</script><figcaption class="ef-cap">An illustration. Recognizing only one link is like thinking a chain needs only one strong link.</figcaption></figure>{% endraw %}
