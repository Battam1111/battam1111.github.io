ight:14%"></i></s><b>discriminant,</b></span><span class="tk"><s><i style="height:6%"></i></s><b>100−84=16</b></span><span class="tk"><s><i style="height:4%"></i></s><b>>0,</b></span><span class="tk hi"><s><i style="height:96%"></i></s><b>so</b></span><span class="tk"><s><i style="height:7%"></i></s><b>the</b></span><span class="tk"><s><i style="height:7%"></i></s><b>roots</b></span><span class="tk"><s><i style="height:20%"></i></s><b>are</b></span><span class="tk"><s><i style="height:18%"></i></s><b>real.</b></span><span class="tk hi"><s><i style="height:80%"></i></s><b>Thus</b></span><span class="tk"><s><i style="height:19%"></i></s><b>t=3</b></span><span class="tk"><s><i style="height:13%"></i></s><b>or</b></span><span class="tk"><s><i style="height:15%"></i></s><b>t=7.</b></span></div><p class="ef-legend"><span><i class="ef-sw bar"></i>The taller the bar, the less sure the model is at that position (higher entropy)</span></p></div><script>(function(){var f=document.getElementById("ef-fork-en"),k=f.querySelector(".ef-fork"),b=f.querySelectorAll(".ef-presets button");b.forEach(function(x,i){x.onclick=function(){k.classList.toggle("only",i===1);b.forEach(function(y,j){y.classList.toggle("on",j===i)})}})})();</script><figcaption class="ef-cap">An illustration; the bar heights are not measured. The paper finds that high-entropy tokens are mostly words like wait, however, thus and suppose, which mark a turn, a step forward or an assumption, while low-entropy tokens are mostly word endings, pieces of formulas and code. Updating only this high-entropy fifth is what the paper does.</figcaption></figure>{% endraw %}
