{% raw %}<figure class="gf ef ef-f-cost" id="ef-cost-ja"><div class="ef-box"><p class="ef-h">サンプリングで力ずくで埋めると、タスクが長いほど、一つの課題に要る試行回数は急に増える</p><div class="ef-ctl"><label for="ef-cost-ja-r">一回の試行のステップ数</label><output for="ef-cost-ja-r">300</output><input type="range" id="ef-cost-ja-r" min="1" max="400" value="300"><div class="ef-presets"><button type="button" data-n="2">数学の問題、2 ステップ</button><button type="button" data-n="30">30 ステップ</button><button type="button" data-n="300">コーディングエージェント、300 ステップ</button></div></div><div class="ef-tiles ef-tiles2"><div class="ef-tile"><span class="k">一回の試行が成功する確率</span><span class="v">2.9%</span></div><div class="ef-tile"><span class="k">一つの課題に要る試行</span><span class="v">78 回</span><span class="s">グループに少なくとも一回の成功があると 9 割の確かさで言えるまで</span></div></div><div class="ef-dots" aria-label="点一つが一回の試行"><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span></div><p class="ef-more"></p><p class="ef-legend"><span><span class="ef-dot bad"></span>点一つが一回の試行</span></p></div><script>(function(){var f=document.getElementById("ef-cost-ja"),T={"unit": "{} 回", "more": "描いていない残り {} 回"},M=240,r=f.querySelector("input"),o=f.querySelector("output"),v=f.querySelectorAll(".ef-tile .v"),box=f.querySelector(".ef-dots"),more=f.querySelector(".ef-more");function up(){var n=+r.value,p=.6*Math.pow(.99,n),g=Math.ceil(Math.log(.1)/Math.log(1-p)),k=Math.min(g,M);o.textContent=n;v[0].textContent=(p*100).toFixed(1)+"%";v[1].textContent=T.unit.replace("{}",g);while(box.children.length<k){var s=document.createElement("span");s.className="d";box.appendChild(s)}while(box.children.length>k)box.removeChild(box.lastChild);more.textContent=g>M?T.more.replace("{}",g-M):""}r.oninput=up;f.querySelectorAll("button").forEach(function(b){b.onclick=function(){r.value=b.dataset.n;up()}});up()})();</script><figcaption class="ef-cap">説明のための計算で、実測ではありません。仮定は『中国の大規模モデルは、なぜ RL がうまくいかないのか』のタスクの長さの図と同じで、各試行は 6 割の確率で正しい方向に進み、そのあとは各ステップが 1% の確率で誤り、一つ誤ると課題全体が失敗します。長いホライズンのタスクでは一回の試行だけでも長い時間がかかり、それに回数を掛ければ、GPU とデータが尽きないという仮定にたどり着きます。</figcaption></figure>{% endraw %}
