# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # use full name
first_name: Yanjun
middle_name:
last_name: Chen
# Shown beside the Latin name in the homepage <title>, the page h1 and the
# profile card, so a search for the Chinese name can match visible text (the
# CV header uses the same "Yanjun Chen 陈彦筠" form).
name_zh: 陈彦筠
# Japanese text writes Chinese names in Japanese kanji forms (陈 -> 陳).
name_ja: 陳彦筠
# Profiles outside _data/socials.yml that belong to the same person; added to the
# homepage's JSON-LD "sameAs" so search engines tie the Chinese platforms to this site.
same_as_extra:
  - https://www.xiaohongshu.com/user/profile/640ae5a5000000000f011e55
  - https://space.bilibili.com/8378592
  - https://www.zhihu.com/people/xing-zhe-qian-mian
# Appended to the HOMEPAGE <title> only (other pages already carry their own
# page title). "Yanjun Chen" on its own competes with every other researcher of
# that name; the field plus the institution is what makes a name query resolve
# here. Keep the whole title under ~60 characters or Google truncates it.
title_suffix: "Reinforcement Learning, HK PolyU"
contact_note: >
  <span lang="en">Email is the best way to reach me. I am open to collaborations on RL for long-horizon agents, on credit assignment, and on ways to make the environment trainable.</span><span lang="zh">邮件是最好的联系方式。欢迎合作：长程 agent 的 RL、credit assignment，以及让环境本身可训练的各种做法。</span><span lang="ja">ご連絡はメールが最適です。長期タスクの agent のための RL、credit assignment、そして環境そのものを訓練可能にするさまざまな方法について、共同研究を歓迎します。</span>
# Meta description. Search snippets are cut at roughly 155 characters, so this
# must stay inside that budget or the positioning never reaches the reader (the
# previous 287-character version was truncated mid-clause, and Bing flagged it).
description: >
  Yanjun Chen (陈彦筠), PhD candidate, Hong Kong PolyU. Reinforcement learning for LLMs and agents: an agent becomes what its environment teaches it.
footer_text: >
  <span lang="en"><a href="https://github.com/Battam1111/battam1111.github.io">Source on GitHub</a>.</span><span lang="zh"><a href="https://github.com/Battam1111/battam1111.github.io">源代码在 GitHub</a>。</span><span lang="ja"><a href="https://github.com/Battam1111/battam1111.github.io">ソースは GitHub にて公開</a>。</span>
keywords: reinforcement learning, RLHF, RLVR, reward models, verifiers, curriculum, credit assignment, LLM post-training, RL environments, embodied AI, PolyU
lang: en
# jekyll-polyglot: every page is written once per language from the same source, English at the root,
# Chinese under /zh/ and Japanese under /ja/. Each build keeps only its own language's <span lang> and
# <div lang> blocks (_plugins/lang-blocks.rb); head.liquid links the versions with hreflang, sitemap.xml lists them all.
languages: ["en", "zh", "ja"]
default_lang: "en"
# Written once at the root and never prefixed: the asset tree (css, js, images, PDFs, films) and the root
# files that only make sense once.
exclude_from_localization: ["assets", "robots.txt", "sitemap.xml", "feed.xml", "b7d3bf4ebb505c273f1876f024b317a2.txt"]
# Serial: polyglot's own advice when other plugins share the build.
parallel_localization: false
icon: favicon.svg   # v10: typographic Y favicon (al-folio prepends assets/img/ automatically)

url: https://battam1111.github.io
baseurl: "" # personal site — leave empty
last_updated: true # show last updated date in footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

bib_search: true

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
# see https://schema.org/docs/faq.html for more information
serve_og_meta: true # Include Open Graph meta tags in the HTML head
serve_schema_org: true # Include Schema.org in the HTML head
og_image: og-card.png    # 1200x630 social share card (assets/img/og-card.png)

# v23: manual cache-bust (al-folio's bust_css_cache is broken — emits empty MD5 because it
# hashes pre-Sass source). Bumped on every visual/content change so browsers pick up new CSS.
# asset_version (the ?v= on main.css) is not set here: the deploy workflow writes the commit id into _version.yml
# and builds with --config _config.yml,_version.yml, so every deploy busts the stylesheet cache by itself.

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

# v23: GoatCounter — privacy-friendly visitor analytics (no cookies, GDPR-friendly, free)
# Setup: 1) register at https://www.goatcounter.com/signup
#        2) get a domain like battam1111.goatcounter.com
#        3) fill in `goatcounter_username: battam1111` below — tracking starts on next deploy
# Leave empty to disable tracking entirely. No data is sent until this is set.
goatcounter_username: battam1111       # e.g. battam1111 (without .goatcounter.com)
goatcounter_show_counter: true        # set true to display a discrete visit counter in the footer

# For Google Search Console, see https://support.google.com/webmasters/answer/9008080?hl=en#meta_tag_verification&zippy=%2Chtml-tag
google_site_verification: scxGXudtC95e-B0Fh_9REfoWQb_5B364DgFSjnDAwUY # Google Search Console, URL-prefix property https://battam1111.github.io/
bing_site_verification: DB9366C57C5757063B5011E912343CAA # Bing Webmaster Tools (also feeds DuckDuckGo and some AI search)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

permalink: /blog/:year/:title/
lsi: false # produce an index for related posts

# Pagination
pagination:
  enabled: true

# https://help.disqus.com/en/articles/1717111-what-s-a-shortname

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: false # every item is inline on the homepage and /news/; one-sentence pages only add thin URLs
  projects:
    output: false
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages", "_scripts"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - DEVELOPMENT.md
  - readme_preview/
  - vendor
  # v24: never publish internal/dev material to the public _site.
  # docs/ is gone from the repo (moved to a private sibling), but keep the
  # rule as a guard. tools/ holds the CV->PDF source (tools/cv/) + gitignored
  # dev scratch; it is build-time-irrelevant (Jekyll never runs the Python
  # pipeline) so it must not leak. Both were previously published (HTTP 200).
  - docs/
  - tools/
keep_files:
  - CNAME
  - .nojekyll

# Plug-ins
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-polyglot
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-socials
  - jekyll-terser

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # set to false since we are using terser as the js minifier
  compress_css: false # Sass already writes compressed CSS; cssminify2 strips the spaces calc() and clamp() need around + and -
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [] # off while Notes has two posts: each archive page would list one or two of them (thin URLs). Turn back on with blog_archive_links: true
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: []

blog_archive_links: false # tag and category chips link to archive pages only when archives are on
display_tags: [] # v19: cleared al-folio demo tags; will populate as Notes grow
display_categories: [] # v19: cleared al-folio demo categories

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Chen]
  first_name: [Yanjun, Y., "Y-J"]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    eprint,
    google_scholar_id,
    hal,
    html,
    inspirehep_id,
    pdf,
    pmid,
    poster,
    preview,
    pub_type,
    selected,
    slides,
    supp,
    video,
    website,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors

# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

# These are the defaults
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
#   convert -version
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see https://github.com/alshedivat/al-folio/issues/537)
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"

# Lazy loading images
#   If you enable lazy loading, all images will add the loading="lazy" attribute.
#   This will make your site load faster, but it may not be supported in all browsers.
#   You can also set loading="" to other values for specific images to override the default behavior.
#   Options: "auto", "eager", "lazy"
#   See https://web.dev/browser-level-image-lazy-loading/ for more information.
lazy_loading_images: true # enables lazy loading of images (recommended)

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_darkmode: true # enables switching between light/dark modes

# -----------------------------------------------------------------------------
# Library versions
# -----------------------------------------------------------------------------

# Add the url, version and integrity hash of the libraries you use in your site.
# The integrity hash is used to ensure that the library is not tampered with.
# Integrity hashes not provided by the libraries were generated using https://www.srihash.org/
third_party_libraries:
  download: false # if true, download the versions of the libraries specified below and use the downloaded files
  vega:
    integrity:
      js: "sha256-Rj89tqQLIOl0e07TjzftCt1QiDj5FBsc+DZnhLB7MMg="
      js_map: "sha256-7jiiC8y3qntMYFFN6NpKM+crPdx55ldvgy6RgCAtbfA="
    url:
      js: "https://cdn.jsdelivr.net/npm/vega@{{version}}/build/vega.min.js"
      js_map: "https://cdn.jsdelivr.net/npm/vega@{{version}}/build/vega.min.js.map"
    version: "5.33.1" # the 5.x maintenance release vega-interpreter 1.2.1 is built against
  vega-embed:
    integrity:
      js: "sha256-FPCJ9JYCC9AZSpvC/t/wHBX7ybueZhIqOMjpWqfl3DU="
      js_map: "sha256-VBbfSEFYSMdX/rTdGrONEHNP6BprCB7H/LpMMNt/cPA="
    url:
      js: "https://cdn.jsdelivr.net/npm/vega-embed@{{version}}/build/vega-embed.min.js"
      js_map: "https://cdn.jsdelivr.net/npm/vega-embed@{{version}}/build/vega-embed.min.js.map"
    version: "6.24.0"
  # The site's CSP has no 'unsafe-eval', so Vega must evaluate expressions with this interpreter (vega-embed `ast: true`).
  # 1.x is the line for Vega 5.
  vega-interpreter:
    integrity:
      js: "sha256-7hkc8EFo4MBDIUzqfE5e+A6QjaoOdXwZyAYd9fiYz4k="
      js_map: "sha256-V9QOIPfVyLKszniFKf0Mifl+Zger3kEyVCioyzRnhxY="
    url:
      js: "https://cdn.jsdelivr.net/npm/vega-interpreter@{{version}}/build/vega-interpreter.min.js"
      js_map: "https://cdn.jsdelivr.net/npm/vega-interpreter@{{version}}/build/vega-interpreter.min.js.map"
    version: "1.2.1"
  vega-lite:
    integrity:
      js: "sha256-TvBvIS5jUN4BSy009usRjNzjI1qRrHPYv7xVLJyjUyw="
      js_map: "sha256-l2I4D5JC23Ulsu6e3sKVe5AJ+r+DFkzkKnZS8nUGz28="
    url:
      js: "https://cdn.jsdelivr.net/npm/vega-lite@{{version}}/build/vega-lite.min.js"
      js_map: "https://cdn.jsdelivr.net/npm/vega-lite@{{version}}/build/vega-lite.min.js.map"
    version: "5.16.3"
