name: Sync Google Scholar

on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Scholar snapshot
        run: npm run sync:scholar

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- src/data/scholar.generated.json; then
            echo "No Scholar changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar.generated.json
          git commit -m "chore: sync Google Scholar snapshot"
          git push
